[package]
name = "rd_driver"
description = "RD/DFABI confidential wallet, BI audit and DvP driver for the Iroha 2 track (platforms/iroha2/docs/spec-g2-g5.md)"
edition.workspace = true
version.workspace = true
publish = false

[lib]
name = "rd_driver"
path = "src/lib.rs"

[[bin]]
name = "rd2"
path = "src/main.rs"

[dependencies]
iroha = { workspace = true }
iroha_core = { workspace = true }
iroha_data_model = { workspace = true }
iroha_crypto = { workspace = true }
iroha_primitives = { workspace = true }
norito = { workspace = true }
clap = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
hex = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
hkdf = { version = "0.12.4", default-features = false, features = ["std"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
rand_core_06 = { workspace = true, features = ["getrandom"] }
