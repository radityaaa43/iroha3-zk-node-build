# Build and push the node image (iroha3d, iroha3, kagami, rd2, rd-genesis) on a GitHub-hosted runner.
# Manual dispatch or push to main. Tag: ghcr.io/radityaaa43/iroha3-zk-node:fbe677b9-<commit>; pin by the digest
# printed in the job summary (KPID-poc/Rupiah-Digital-Eksplorasi platforms/iroha/deploy/overlays/*).
name: build-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['image/**', 'fork/**', 'driver/**', 'tools/**', 'ci/prepare-src.sh', '.github/workflows/build-image.yml']
permissions:
  contents: read
  packages: write
concurrency:
  group: build-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      IMAGE: ghcr.io/radityaaa43/iroha3-zk-node:fbe677b9-${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          docker system prune -af
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile.build && sudo chmod 600 /swapfile.build && sudo mkswap /swapfile.build && sudo swapon /swapfile.build || echo "::warning::no swap"
          nproc; free -g; df -h /
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          ( while sleep 300; do echo "::group::resources $(date -u +%H:%M)"; free -m | sed -n 2,3p; df -h / | tail -1; echo "::endgroup::"; done ) &
          CARGO_BUILD_JOBS=2 image/build.sh "$IMAGE"
      - name: Push
        run: docker push "$IMAGE"
      - name: Digest
        run: |
          d=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          { echo "pushed \`$IMAGE\`"; echo; echo "pin by digest: \`$d\`"; } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$d"
